<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | DataSource Wiki</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background-color: #f6f6f6;
            color: #202122;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        #container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
        }
        #sidebar {
            width: 170px;
            padding: 1em;
            font-size: 0.85em;
            border-right: 1px solid #a7d7f9;
            background-color: #f6f6f6;
            flex-shrink: 0;
        }
        #sidebar img.logo { width: 135px; margin-bottom: 1em; }
        #sidebar ul { list-style-type: none; padding: 0; margin: 0 0 1.5em 0; }
        #sidebar li { margin-bottom: 0.4em; }
        #sidebar a { color: #0645ad; text-decoration: none; }
        #sidebar a:hover { text-decoration: underline; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #header-tabs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5em 2.5em;
            background-color: #ffffff;
            border-bottom: 1px solid #a2a9b1;
            font-size: 0.85em;
        }
        .tab-group { display: flex; gap: 0.5em; align-items: center; }
        .tab {
            padding: 0.5em 0.8em;
            background-color: #f8f9fa;
            border: 1px solid #a2a9b1;
            border-bottom: none;
            border-radius: 2px 2px 0 0;
            color: #0645ad;
            text-decoration: none;
        }
        .tab.active {
            background-color: #ffffff;
            font-weight: bold;
            color: #202122;
            border-bottom: 1px solid #ffffff;
            margin-bottom: -1px;
        }
        .top-search-group {
            display: flex;
            align-items: center;
            gap: 0.3em;
        }
        .top-search-group input[type="text"] {
            padding: 0.3em 0.5em;
            font-size: 0.85em;
            border: 1px solid #a2a9b1;
            border-radius: 2px;
            width: 200px;
        }
        .top-search-group button {
            padding: 0.3em 0.6em;
            font-size: 0.85em;
            cursor: pointer;
            background-color: #f8f9fa;
            border: 1px solid #a2a9b1;
            border-radius: 2px;
        }
        .top-search-group button:hover {
            background-color: #eef1f4;
        }
        #content { padding: 1.5em 2.5em; flex: 1; }
        h1#firstHeading {
            font-family: 'Linux Libertine', 'Georgia', 'Times', serif;
            font-size: 1.8em;
            font-weight: normal;
            border-bottom: 1px solid #a2a9b1;
            margin-top: 0;
            padding-bottom: 0.2em;
        }
        a { color: #0645ad; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error-box {
            background-color: #fdf2f2;
            border: 1px solid #f5c6cb;
            padding: 1.5em;
            margin: 1.5em 0;
            border-left: 5px solid #d9534f;
        }
        .alphabet-index {
            margin: 1.5em 0;
            padding: 0.8em;
            background-color: #f8f9fa;
            border: 1px solid #a2a9b1;
            text-align: center;
            font-size: 0.95em;
            line-height: 2em;
        }
        .alphabet-index span {
            font-weight: bold;
            margin-right: 0.5em;
            display: block;
        }
        .alphabet-index a {
            padding: 0 0.3em;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="main">
        <div id="header-tabs">
            <div class="tab-group">
                <a href="index.html"><b>Main Page</b></a>
            </div>
            <div class="tab-group">
                <form class="top-search-group" onsubmit="handleSearch(event)">
                    <input type="text" id="wikiSearchInput" placeholder="Search DataSource Wiki...">
                    <button type="submit">Search</button>
                </form>
            </div>
        </div>

        <div id="content">
            <h1 id="firstHeading" style="text-align: center"><b>404</b><br> Page not found</h1>
            <div class="error-box">
                <strong>The requested page does not exist on this wiki.</strong>
                <p>It may have been deleted, moved, or misspelled in your request.</p>
            </div>

            <div class="alphabet-index">
                <span>Browse by letter:</span>
                <a href="search.html?search=A">A</a> |
                <a href="search.html?search=B">B</a> |
                <a href="search.html?search=C">C</a> |
                <a href="search.html?search=D">D</a> |
                <a href="search.html?search=E">E</a> |
                <a href="search.html?search=F">F</a> |
                <a href="search.html?search=G">G</a> |
                <a href="search.html?search=H">H</a> |
                <a href="search.html?search=I">I</a> |
                <a href="search.html?search=J">J</a> |
                <a href="search.html?search=K">K</a> |
                <a href="search.html?search=L">L</a> |
                <a href="search.html?search=M">M</a> |
                <a href="search.html?search=N">N</a> |
                <a href="search.html?search=O">O</a> |
                <a href="search.html?search=P">P</a> |
                <a href="search.html?search=Q">Q</a> |
                <a href="search.html?search=R">R</a> |
                <a href="search.html?search=S">S</a> |
                <a href="search.html?search=T">T</a> |
                <a href="search.html?search=U">U</a> |
                <a href="search.html?search=V">V</a> |
                <a href="search.html?search=W">W</a> |
                <a href="search.html?search=X">X</a> |
                <a href="search.html?search=Y">Y</a> |
                <a href="search.html?search=Z">Z</a>
            </div>
        </div>
    </div>
</div>

<script>
function handleSearch(event) {
    event.preventDefault();
    const query = document.getElementById('wikiSearchInput').value;
    const MAX_LENGTH = 50;

    if (query.length > MAX_LENGTH) {
        window.location.href = '404.html';
    } else {
        window.location.href = 'search.html?search=' + encodeURIComponent(query);
    }
}
</script>

</body>
</html>
